name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Rollback drill (STOP 9 evidence): dispatch with rollback_drill=true to exercise
  # the rollback code path end-to-end WITHOUT reverting — it redeploys the CURRENT
  # HEAD via the exact rollback steps, proving the "redeploy-from-SHA + notify"
  # machinery works before we ever have to trust it on a real red deploy.
  workflow_dispatch:
    inputs:
      rollback_drill:
        description: 'Exercise the rollback path against current HEAD (proves the mechanism; does NOT revert). Leave false for a normal run.'
        type: boolean
        default: false
      api_rollback_drill:
        description: 'Exercise the API rollback path by redeploying the CURRENTLY RUNNING image (proves the mechanism; changes nothing). Leave false for a normal run.'
        type: boolean
        default: false

jobs:
  # Test gate (STOP 19): the full api suite — including TestWebhookFulfillmentE2E,
  # the purchase->fulfillment E2E from commit da74dab — must pass before anything
  # deploys. All 12 test files are hermetic (httptest servers + t.Setenv fake
  # credentials; in-memory store fakes, no live Postgres/Stripe/Shippo/Resend),
  # so NOTHING is skipped in CI as of 2026-07-27. Live-integration paths (real
  # Stripe webhooks, Shippo label purchase, Resend delivery) are exercised only
  # in production — if a future test needs live creds, guard it with t.Skip on a
  # missing env var and document it here; do not fake a pass.
  test-api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Run api tests
        run: cd api && go test ./...

  # ── API tier: deploy + verify + rollback (issue #7) ──────────────────────────
  # The Go API terminates the money path — /api/checkout, /api/webhooks/stripe,
  # /api/admin/*. Before this job it shipped BY HAND with no post-deploy check and
  # no revert, which is how a config change took /api/* down for 6m40s on 2026-10-02.
  #
  # SCOPE, stated because it is easy to assume otherwise: this covers CODE deploys.
  # It canNOT recover a bad SECRET/config change. Fly secret changes create a new
  # release that REUSES the existing image (17 distinct images across 25 releases),
  # so redeploying "the previous image" is a silent no-op against a config regression.
  # Secret rotations follow Claude/secret-rotation-2026-10-01.md, not this job.
  deploy-api:
    runs-on: ubuntu-24.04
    needs: test-api
    if: github.event_name == 'push' || github.event.inputs.api_rollback_drill == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # need history to diff the push range

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Decide whether the API needs deploying
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=drill" >> "$GITHUB_OUTPUT"; echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "DRILL — will redeploy the running image, changing nothing."; exit 0
          fi
          echo "mode=deploy" >> "$GITHUB_OUTPUT"
          # If the push range cannot be resolved, deploy rather than silently skip.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Push range unresolvable — deploying (fail toward shipping, not toward skipping)."
          elif git diff --name-only "$BEFORE" "${{ github.sha }}" -- api/ | grep -q .; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; echo "api/ changed — deploying."
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"; echo "api/ unchanged — skipping deploy."
          fi

      # Captured BEFORE deploying. This is the only reliable rollback target: the
      # image that is actually serving right now. The previous RELEASE is not a
      # safe target because secret-change releases carry the same image forward.
      - name: Capture the running image (rollback target)
        id: prev
        if: steps.scope.outputs.deploy == 'true' || steps.scope.outputs.mode == 'drill'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          IMG=$(flyctl releases --image -j -a immortalvibes-api | jq -r '.[0].ImageRef')
          if [ -z "$IMG" ] || [ "$IMG" = "null" ]; then
            echo "Could not determine the running image — refusing to deploy without a rollback target." >&2
            exit 1
          fi
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
          echo "rollback target: $IMG"

      - name: Deploy API to Fly
        if: steps.scope.outputs.deploy == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: cd api && flyctl deploy --remote-only --now --wait-timeout 300

      - name: Redeploy the running image (DRILL — proves the mechanism)
        if: steps.scope.outputs.mode == 'drill'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy -i "${{ steps.prev.outputs.image }}" -a immortalvibes-api --now --yes --wait-timeout 300

      # /health is EXEMPT from the proxy-secret middleware and returns 200 against a
      # completely wrong secret, so it can never be the check on its own. The three
      # assertions below are the ones that can actually fail independently.
      - name: Smoke the API
        id: smoke
        if: steps.scope.outputs.deploy == 'true' || steps.scope.outputs.mode == 'drill'
        run: ./.github/scripts/smoke-api.sh

      - name: Roll back to the previously running image
        id: rb
        if: failure() && steps.prev.outputs.image != '' && steps.scope.outputs.deploy == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "Smoke failed — restoring ${{ steps.prev.outputs.image }}"
          flyctl deploy -i "${{ steps.prev.outputs.image }}" -a immortalvibes-api --now --yes --wait-timeout 300

      - name: Re-smoke after rollback
        if: always() && steps.rb.outcome == 'success'
        run: ./.github/scripts/smoke-api.sh

      - name: Record evidence (STOP 9)
        if: always()
        run: |
          {
            echo "## API tier — ${{ steps.scope.outputs.mode }}"
            echo "- deploy attempted: ${{ steps.scope.outputs.deploy }}"
            echo "- rollback target image: \`${{ steps.prev.outputs.image }}\`"
            echo "- smoke: ${{ steps.smoke.outcome }}"
            echo "- rollback: ${{ steps.rb.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify (best-effort — posts only if the secrets exist)
        if: failure()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MSG="IV API deploy FAILED (smoke=${{ steps.smoke.outcome }}, rollback=${{ steps.rb.outcome }}). ${RUN_URL}"
          if [ -n "$NTFY_URL" ] && [ -n "$NTFY_TOPIC" ]; then
            curl -fsS -H "Title: immortalvibes API deploy" -d "$MSG" "$NTFY_URL/$NTFY_TOPIC" || true
          fi

  deploy-pages:
    runs-on: ubuntu-24.04
    needs: test-api # the Worker job is gone (see below); gate is the api test suite
    if: github.event_name == 'push' # defense-in-depth: never deploy on PRs
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm ci

      - name: Build
        run: cd web && npm run build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy web/.svelte-kit/cloudflare --project-name immortalvibes-store --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── L1: post-deploy live verification ────────────────────────────────────────
  # Runs the FULL live customer journey (web/e2e/storefront.spec.ts, live project)
  # against theimmortalvibes.com immediately after each deploy. The journey walks
  # add-to-cart -> checkout -> Stripe Payment Element and STOPS (never pays), which
  # leaves ONE clearly-labelled pending order per run ("E2E GATE - DO NOT FULFILL")
  # — the same harmless side effect the weekly smoke already produces, now per-deploy.
  # A red result here is the trigger for the rollback job below.
  verify-live:
    runs-on: ubuntu-24.04
    needs: deploy-pages
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm ci

      - name: Install Playwright Chromium
        run: cd web && npx playwright install --with-deps chromium

      - name: Run live E2E against production
        run: cd web && npm run e2e:live
        env:
          E2E_TARGET: live

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-verify-live
          path: web/playwright-report/
          retention-days: 14

  # ── L1: auto-rollback ─────────────────────────────────────────────────────────
  # Fires when a deploy SUCCEEDED but the post-deploy live E2E went RED. Restores the
  # previous good commit by redeploying it (uniform mechanism for Worker + Pages —
  # CF Pages has no first-class rollback verb, so we redeploy from the prior SHA).
  # Restores github.event.before (main's tip BEFORE this push) — the commit that was
  # live and already passed verify-live; robust to multi-commit pushes and merge
  # commits (HEAD~1 was not). Also runnable as a DRILL (workflow_dispatch,
  # rollback_drill=true): that path redeploys the CURRENT HEAD instead of reverting,
  # exercising the machinery
  # end-to-end without changing what is live. If the post-rollback smoke ALSO fails,
  # the job goes red and notifies for manual intervention — it never loops.
  rollback:
    runs-on: ubuntu-24.04
    needs: [deploy-pages, verify-live]
    if: >-
      always() &&
      (
        (github.event_name == 'push' &&
         needs.deploy-pages.result == 'success' &&
         needs.verify-live.result == 'failure')
        ||
        (github.event_name == 'workflow_dispatch' &&
         github.event.inputs.rollback_drill == 'true')
      )
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so we can check out the pre-push tip (github.event.before)

      - name: Determine rollback target
        id: target
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHA="$(git rev-parse HEAD)"
            MODE="DRILL (no revert — redeploying current HEAD)"
          else
            # github.event.before = main's tip before this push = the commit that was
            # live and already passed verify-live. Correct even when N>1 commits were
            # pushed at once or the push was a merge commit.
            SHA="$BEFORE_SHA"
            MODE="ROLLBACK (post-deploy E2E red — restoring the previously deployed commit)"
          fi
          if [ -z "$SHA" ] || [ "$SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No valid rollback target (SHA='$SHA') — refusing to redeploy. Manual intervention needed." >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Rollback target: $SHA — $MODE"

      - name: Check out rollback target
        run: git checkout ${{ steps.target.outputs.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Redeploy Pages (previous good)
        # Path is relative to web/ (we cd there first) — must NOT be prefixed with
        # web/ again or it resolves to web/web/.svelte-kit/cloudflare (ENOENT). The
        # normal deploy-pages job runs from the repo root, hence its web/ prefix.
        run: cd web && npm ci && npm run build && npx wrangler pages deploy .svelte-kit/cloudflare --project-name immortalvibes-store --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Install Playwright Chromium
        run: cd web && npx playwright install --with-deps chromium

      # Post-rollback health check: re-run the SAME full live gate that decides
      # health. (An earlier `--grep-invert "Stripe"` matched ZERO tests — the
      # describe title itself contains "Stripe" — so Playwright exited 1 and every
      # rollback went falsely red. The full suite is the unambiguous signal; it
      # leaves one labeled pending order, acceptable during a rare rollback/drill.)
      - name: Verify site healthy after redeploy (full live gate)
        id: postcheck
        run: cd web && npm run e2e:live
        env:
          E2E_TARGET: live

      - name: Record evidence (STOP 9)
        if: always()
        run: |
          {
            echo "## L1 rollback — ${{ steps.target.outputs.mode }}"
            echo ""
            echo "- Redeployed commit: \`${{ steps.target.outputs.sha }}\`"
            echo "- Triggering run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Post-redeploy render smoke: ${{ steps.postcheck.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify (best-effort — posts only if the secrets exist)
        if: always()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODE: ${{ steps.target.outputs.mode }}
          SHA: ${{ steps.target.outputs.sha }}
          POSTCHECK: ${{ steps.postcheck.outcome }}
        run: |
          MSG="IV CD ${MODE}: redeployed ${SHA:0:8}, post-check=${POSTCHECK}. ${RUN_URL}"
          if [ -n "$NTFY_URL" ] && [ -n "$NTFY_TOPIC" ]; then
            curl -fsS -H "Title: immortalvibes CD rollback" -d "$MSG" "$NTFY_URL/$NTFY_TOPIC" || true
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MSG}" || true
          fi
