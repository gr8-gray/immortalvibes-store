name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Test gate (STOP 19): the full api suite — including TestWebhookFulfillmentE2E,
  # the purchase->fulfillment E2E from commit da74dab — must pass before anything
  # deploys. All 12 test files are hermetic (httptest servers + t.Setenv fake
  # credentials; in-memory store fakes, no live Postgres/Stripe/Shippo/Resend),
  # so NOTHING is skipped in CI as of 2026-07-27. Live-integration paths (real
  # Stripe webhooks, Shippo label purchase, Resend delivery) are exercised only
  # in production — if a future test needs live creds, guard it with t.Skip on a
  # missing env var and document it here; do not fake a pass.
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Run api tests
        run: cd api && go test ./...

  deploy-worker:
    runs-on: ubuntu-latest
    needs: test-api
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        run: cd worker && npm ci

      - name: Deploy Worker
        run: cd worker && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set Worker PROXY_SECRET
        run: cd worker && echo "$PROXY_SECRET" | npx wrangler secret put PROXY_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROXY_SECRET: ${{ secrets.WORKER_PROXY_SECRET }}

  deploy-pages:
    runs-on: ubuntu-latest
    needs: deploy-worker # transitively gated on test-api; skipped on PRs
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm ci

      - name: Build
        run: cd web && npm run build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy web/.svelte-kit/cloudflare --project-name immortalvibes-store --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
