# fly.toml app configuration file generated for immortalvibes-api on 2026-04-07
app = 'immortalvibes-api'
primary_region = 'iad'

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # min_machines_running=1: a store taking real payments cannot run its Stripe
  # webhook on a scale-to-zero machine — the post-200 shipping goroutine gets
  # killed when the box stops, so labels never reach Shippo (incident 2026-06-21).
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

# Postgres: attached as immortalvibes-db via `fly postgres attach`
# DATABASE_URL secret is managed by Fly — do not set manually.
